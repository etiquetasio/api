<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atalhos Pullman - Extensão Airtable</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #f3f6ff 0, #e6edfb 50%, #dce4f7 100%);
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --primary: #0052cc;
      --primary-strong: #003b99;
      --shadow: 0 15px 35px rgba(0, 40, 120, 0.12);
      --border: 1px solid rgba(0, 40, 120, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }

    main {
      width: min(1100px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 32px 32px 28px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: contain;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    p.description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 64px;
      padding: 0 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #0079ff);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 25px rgba(0, 82, 204, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
      text-align: center;
    }

    .action:hover,
    .action:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 82, 204, 0.30);
      background: linear-gradient(135deg, var(--primary-strong), var(--primary));
      outline: none;
    }

    .action:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(0, 82, 204, 0.22);
    }

    footer {
      margin-top: 18px;
      text-align: right;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.png" alt="Marca Pullman" class="logo">
      <div>
        <h1>Extensão personalizada do Airtable</h1>
        <p class="description">Acesse rapidamente as automações e webhooks Pullman.</p>
      </div>
    </header>

    <section class="actions" id="actions"></section>

    <footer>Todos os botões abrem em uma nova guia.</footer>
  </main>

  <script>
    const links = [
      { label: "CANAL DO TELEGRAM", url: "https://t.me/+QsZZvQEPgZc2YTU5" },
      { label: "VIRADA CAFÉ DA MANHÃ MANUAL", url: "https://n8n-railway.etiquetas.io/webhook/pullman-cafe" },
      { label: "SINCRONIZAR PRATOS PULLMAN", url: "https://n8n-railway.etiquetas.io/webhook/pullman-pratos" },
      { label: "SINCRONIZAR PRATTOS BASE", url: "https://n8n-railway.etiquetas.io/webhook/base-pratos" },
      { label: "CARREGAR ALERGÊNICOS", url: "https://n8n-railway.etiquetas.io/webhook/carga-alergenicos" },
      { label: "STATUS SUA CONTA", url: "https://n8n-railway.etiquetas.io/webhook/pullman-mon" },
      { label: "BACKUP TEMPLATES", url: "https://n8n-railway.etiquetas.io/webhook/pullman-templates" }
    ];

    const actions = document.getElementById("actions");

    links.forEach(({ label, url }) => {
      const button = document.createElement("a");
      button.className = "action";
      button.href = url;
      button.target = "_blank";
      button.rel = "noopener noreferrer";
      button.textContent = label;
      actions.appendChild(button);
    });
  </script>
</body>
</html>
